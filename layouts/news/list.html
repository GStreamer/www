{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<p class="meta"><a href="/news/rss-1.0.xml">RSS 1.0 feed</a></p>
<div class="news-archive">
{{ range .Pages.ByDate.Reverse }}
<article class="card" aria-labelledby="{{ partial "news-anchor.html" . }}">
<h2 id="{{ partial "news-anchor.html" . }}">{{ .Title }}</h2>
<p class="meta"><time datetime="{{ .Date.UTC.Format "2006-01-02T15:04:00Z" }}">{{ .Date.UTC.Format "2006-01-02 15:04" }}</time></p>
{{ .Content }}
</article>
{{ end }}
</div>
{{ end }}
